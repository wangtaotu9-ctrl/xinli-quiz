<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>你的内心戏是哪种人格｜心里那点事</title>
<meta name="description" content="趣味自我觉察小测试，凭第一直觉选，答案只在本地计算。">
<style>/* 心里那点事 · 趣味小测 —— 大字报杂志风 */
:root{
  --paper:#f7f5ef;
  --paper2:#efece3;
  --ink:#1d1b18;
  --ink2:#5a534b;
  --ink3:#938b80;
  --line:#ddd6c9;
  --hl:#f0457c;         /* 粉高亮 */
  --hl2:#ffe45c;        /* 黄标签 */
  --blue:#2f4bd8;
  --card:#fffdf8;
  --shadow:0 10px 30px rgba(60,45,30,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;padding:0 0 46px;background:var(--card);box-shadow:0 0 40px rgba(60,45,30,.06)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px;font-size:12px;color:var(--ink3);letter-spacing:.5px}
.topbar a{color:var(--ink3);text-decoration:none}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--ink);letter-spacing:1px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--hl)}

/* ---------- 封面 ---------- */
.cover{padding:14px 22px 8px}
.vol{display:flex;justify-content:space-between;font-size:11px;letter-spacing:2px;color:var(--ink3);border-bottom:1px solid var(--ink);padding-bottom:7px;margin-bottom:20px;font-weight:600}
.cover-tag{display:inline-block;background:var(--hl2);color:var(--ink);font-size:12px;font-weight:700;padding:5px 11px;border-radius:2px;transform:rotate(-1.5deg);letter-spacing:1px}
.cover-title{font-size:37px;line-height:1.22;font-weight:900;letter-spacing:-1.5px;margin:18px 0 12px}
.cover-title .hl{background:var(--hl);color:#fff;padding:0 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone;display:inline}
.cover-sub{font-size:14px;color:var(--ink2);margin:0 0 24px;line-height:1.8}
.checklist{list-style:none;margin:0 0 26px;padding:0;border-top:1px solid var(--line)}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--ink2)}
.checklist li .ck{color:var(--blue);font-weight:900;flex:0 0 auto}
.checklist li b{color:var(--ink);font-weight:700}
.cover-btn,.btn{
  display:block;width:100%;border:0;border-radius:0;padding:17px 18px;background:var(--ink);color:#fff;
  font-size:16px;font-weight:800;letter-spacing:1px;cursor:pointer;font-family:inherit;
  transition:transform .12s ease,opacity .12s ease;
}
.cover-btn:active,.btn:active{transform:scale(.99);opacity:.88}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);font-weight:600}
.btn.small{padding:13px;font-size:14px}
.btn.hl{background:var(--hl)}
.btn-row{display:flex;gap:10px;margin-top:10px}
.btn-row .btn{flex:1}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin:14px 0 0;letter-spacing:.5px}
.meta b{color:var(--ink2)}

/* ---------- 付费门禁 ---------- */
.paywall{margin:0 0 0;border-top:1px solid var(--line);background:var(--paper2);padding:22px 22px 26px}
.paywall .lock{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:12px}
.paywall h3{font-size:19px;margin:0 0 6px;font-weight:900}
.paywall p{font-size:13px;color:var(--ink2);margin:0 0 16px;line-height:1.8}
.price{font-size:30px;font-weight:900;letter-spacing:-1px;color:var(--hl);margin:0 0 4px}
.price small{font-size:13px;color:var(--ink3);font-weight:500;letter-spacing:0;margin-left:6px}
.code-input{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:14px 15px;
  font-size:15px;letter-spacing:1px;color:var(--ink);font-family:inherit;outline:none;margin-bottom:10px;
}
.code-input:focus{border-color:var(--hl)}
.err{font-size:12.5px;color:var(--hl);min-height:18px;margin:0 0 8px}
.pay-note{font-size:11.5px;color:var(--ink3);line-height:1.75;margin:14px 0 0}

/* ---------- 答题 ---------- */
.quiz{padding:22px 22px 0}
.qcount{font-size:11px;letter-spacing:2px;color:var(--ink3);font-weight:700}
.progress{height:5px;background:var(--paper2);border-radius:99px;overflow:hidden;margin:9px 0 24px}
.progress i{display:block;height:100%;background:var(--hl);border-radius:99px;transition:width .25s ease}
.qtitle{font-size:21px;line-height:1.6;margin:0 0 8px;font-weight:800;letter-spacing:-.3px}
.qhint{font-size:12.5px;color:var(--ink3);margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:14px 15px;
  font-size:14.5px;color:var(--ink2);cursor:pointer;text-align:left;font-family:inherit;
  display:flex;align-items:center;gap:11px;transition:all .15s ease;line-height:1.55;
}
.opt:active{transform:scale(.99)}
.opt:hover{border-color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink3);flex:0 0 auto}
.opt.on{border-color:var(--hl);background:#fff2f6;color:var(--ink)}
.opt.on .k{background:var(--hl);border-color:var(--hl);color:#fff}
.backlink{margin-top:20px;text-align:center;font-size:12.5px;color:var(--ink3);cursor:pointer}

/* ---------- 结果 ---------- */
.result{padding:22px 22px 0}
.result-tag{font-size:11px;letter-spacing:2px;color:var(--hl);font-weight:800}
.result-title{font-size:30px;line-height:1.3;margin:10px 0 6px;font-weight:900;letter-spacing:-1px}
.result-lead{font-size:14px;color:var(--ink2);margin:0 0 18px}
.concentration{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--ink3);margin-bottom:18px}
.concentration b{font-size:32px;color:var(--hl);font-weight:900;letter-spacing:-1px}
.result-body{font-size:14.5px;color:var(--ink2);line-height:1.9;border-top:1px solid var(--line);padding-top:16px}
.result-body p{margin:0 0 12px}
.bars{margin:20px 0 6px}
.bar{margin-bottom:11px}
.bar .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:4px}
.bar .lab b{color:var(--ink)}
.bar .track{height:7px;background:var(--paper2);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--hl);border-radius:99px;transition:width .7s ease}
.bar.top .track i{background:var(--ink)}
.gift{background:var(--hl2);border-radius:8px;padding:15px 16px;margin:18px 0 0;font-size:14px;color:var(--ink);line-height:1.8;font-weight:600}
.gift .lab{font-size:10px;letter-spacing:2px;color:var(--ink3);display:block;margin-bottom:5px;font-weight:700}
.share-box{margin-top:22px;border-top:1px dashed var(--line);padding-top:18px}
.share-box .lab{font-size:11.5px;color:var(--ink3);margin-bottom:8px;letter-spacing:1px}
.share-text{background:var(--paper2);border-radius:8px;padding:14px;font-size:13px;color:var(--ink2);line-height:1.8;white-space:pre-wrap}
.allresults{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.allresults h4{font-size:14px;margin:0 0 12px;font-weight:800}
.allrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--paper2);font-size:12.5px;color:var(--ink2)}
.allrow .n{font-size:11px;color:var(--ink3);width:22px;flex:0 0 auto}
.allrow .nm{font-weight:700;color:var(--ink);width:92px;flex:0 0 auto}
.allrow .ds{line-height:1.6}

.note{font-size:11px;color:var(--ink3);line-height:1.8;margin:22px 22px 0;padding-top:14px;border-top:1px solid var(--line)}
.src{font-size:11px;color:var(--ink3);line-height:1.8;margin:10px 22px 0}
.src a{color:var(--ink2)}
.footer{text-align:center;font-size:11px;color:var(--ink3);padding:24px 20px 6px;line-height:1.8}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);background:rgba(29,27,24,.94);color:#fff;font-size:13px;padding:11px 20px;border-radius:99px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- 首页 ---------- */
.hero{padding:26px 22px 14px}
.hero .vol{margin-bottom:16px}
.hero h1{font-size:31px;line-height:1.28;font-weight:900;letter-spacing:-1px;margin:0 0 10px}
.hero p{font-size:13.5px;color:var(--ink2);margin:0;line-height:1.8}
.testcard{display:block;text-decoration:none;color:inherit;margin:0 22px 14px;border:1.5px solid var(--ink);border-radius:4px;padding:18px 18px 16px;background:#fff;position:relative;box-shadow:4px 4px 0 var(--ink)}
.testcard .vol{font-size:10px;border:0;margin:0 0 10px;padding:0;letter-spacing:2px;color:var(--ink3)}
.testcard h2{font-size:21px;line-height:1.35;margin:0 0 8px;font-weight:900;letter-spacing:-.5px}
.testcard .hl{background:var(--hl);color:#fff;padding:0 5px}
.testcard p{font-size:12.5px;color:var(--ink2);margin:0 0 14px;line-height:1.7}
.testcard .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink3);border-top:1px solid var(--line);padding-top:11px}
.testcard .foot .p{color:var(--hl);font-weight:900;font-size:15px}
.testcard .foot .go{font-weight:800;color:var(--ink)}
.notice{margin:8px 22px 0;background:var(--paper2);border-radius:6px;padding:14px 15px;font-size:12px;color:var(--ink2);line-height:1.85}
.notice b{color:var(--ink)}

/* ============================================================
   主题一 · 青绿（城市测试）—— 复刻抖音截图封面
   ============================================================ */
.wrap.theme-teal{
  --paper:#fbfaf5;--paper2:#eef4f1;--ink:#1b2421;--ink2:#4c5a54;--ink3:#93a29b;
  --line:#d9e6e0;--hl:#3f9c8f;--hl2:#d7efe8;--blue:#3f9c8f;--card:#ffffff;
  --teal:#3f9c8f;--teal-d:#2f7d72;--teal-l:#e6f4f0;
}
.theme-teal .brand .dot{background:var(--teal)}
.theme-teal .cover-title .hl{background:var(--teal)}
.theme-teal .cover-tag{background:var(--teal);color:#fff;transform:rotate(-1.5deg)}
.theme-teal .checklist li .ck{
  width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--teal);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;line-height:1;
}
.theme-teal .cover-btn{
  background:var(--teal);color:#fff;border-radius:99px;font-size:17px;padding:15px;
  box-shadow:0 6px 16px rgba(63,156,143,.28);max-width:230px;margin:0 auto;
}
.theme-teal .btn.hl{background:var(--teal)}
.theme-teal .code-input:focus{border-color:var(--teal)}
.theme-teal .price,.theme-teal .result-tag,.theme-teal .concentration b{color:var(--teal-d)}
.theme-teal .progress i,.theme-teal .bar .track i{background:var(--teal)}
.theme-teal .opt.on{border-color:var(--teal);background:var(--teal-l);color:var(--ink)}
.theme-teal .opt.on .k{background:var(--teal);border-color:var(--teal)}
.theme-teal .opt{border-radius:99px;padding:13px 16px}
.theme-teal .opt:hover{border-color:var(--teal)}
.theme-teal .opt .k{border-radius:50%;background:var(--teal-l);border-color:var(--teal-l);color:var(--teal-d)}
.theme-teal .gift{background:var(--teal-l)}
.theme-teal .err{color:var(--teal-d)}

/* 4 维度胶囊网格 */
.checklist.pill{list-style:none;margin:0 0 20px;padding:0;border:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.checklist.pill li{
  display:flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:99px;
  padding:9px 11px;background:#fff;font-size:13px;box-shadow:0 2px 8px rgba(40,80,70,.04);
}
.checklist.pill li .ck{width:20px;height:20px;flex:0 0 auto;border-radius:50%;background:var(--teal);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;line-height:1}
.checklist.pill li .pt{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.checklist.pill li b{font-size:13px;color:var(--ink);font-weight:800}
.checklist.pill li small{font-size:10.5px;color:var(--ink3);margin-top:2px}

/* 封面插画 */
.cover-art{margin:6px 0 18px;line-height:0;border-radius:14px;overflow:hidden}
.cover-art svg{width:100%;height:auto;display:block}
.slogan{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",cursive;font-style:italic;
  font-size:17px;color:var(--teal-d);text-align:right;margin:-4px 4px 18px;
  transform:rotate(-3deg);letter-spacing:1px;font-weight:700;
}
.slogan::after{content:"";display:block;width:120px;height:2px;background:var(--teal);margin:5px 0 0 auto;opacity:.55;border-radius:99px;transform:rotate(-2deg)}

/* ============================================================
   主题二 · 水墨（资治通鉴历史人物）
   ============================================================ */
.wrap.theme-ink{
  --paper:#f3ece0;--paper2:#e9dfcc;--ink:#26221c;--ink2:#5c5344;--ink3:#9a8f7c;
  --line:#d8ccb4;--hl:#a8402f;--hl2:#ecd9a8;--blue:#6b6a4a;--card:#faf5ea;
  --seal:#a8402f;
  font-family:"Songti SC","STSong","SimSun","宋体",serif;
}
.theme-ink{background:#e9dfcc}
.theme-ink .brand .dot{background:var(--seal);border-radius:2px}
.theme-ink .cover-title{letter-spacing:0}
.theme-ink .cover-title .hl{background:var(--seal)}
.theme-ink .cover-tag{background:var(--seal);color:#fff;transform:none;border-radius:2px}
.theme-ink .checklist li .ck{color:var(--seal);font-weight:900}
.theme-ink .cover-btn{background:var(--seal);border-radius:2px;box-shadow:3px 3px 0 rgba(168,64,47,.25)}
.theme-ink .btn.hl{background:var(--seal)}
.theme-ink .code-input:focus{border-color:var(--seal)}
.theme-ink .price,.theme-ink .result-tag,.theme-ink .concentration b{color:var(--seal)}
.theme-ink .progress i,.theme-ink .bar .track i{background:var(--seal)}
.theme-ink .opt.on{border-color:var(--seal);background:#f6ead9;color:var(--ink)}
.theme-ink .opt.on .k{background:var(--seal);border-color:var(--seal)}
.theme-ink .opt{border-radius:3px}
.theme-ink .gift{background:var(--hl2)}
.theme-ink .err{color:var(--seal)}
.theme-ink .checklist.pill li{border-radius:3px;box-shadow:2px 2px 0 rgba(92,83,68,.12)}
.theme-ink .checklist.pill li .ck{background:var(--seal);border-radius:2px}
.theme-ink .slogan{color:var(--seal);font-size:16px}
.theme-ink .slogan::after{background:var(--seal)}
.theme-ink .result-title,.theme-ink .cover-title,.theme-ink .testcard h2{font-family:"Songti SC","STSong","SimSun",serif}

/* 首页主题色卡片（用内联 class 标注） */
.testcard.teal-card{box-shadow:4px 4px 0 var(--teal,#3f9c8f);border-color:#3f9c8f}
.testcard.teal-card .hl{background:#3f9c8f}
.testcard.teal-card .foot .p{color:#3f9c8f}
.testcard.ink-card{box-shadow:4px 4px 0 #a8402f;border-color:#a8402f}
.testcard.ink-card .hl{background:#a8402f}
.testcard.ink-card .foot .p{color:#a8402f}
</style></head>

      share:"测出来是「一秒存档型」。原来不反复琢磨，真的是一种能力。\n{link}"},
    {k:"b",n:"弹幕旁白型",tag:"脑子里总有个实时解说",
      body:["你不太纠结，但脑子爱配旁白：电梯里、排队时、别人说话的空隙，都会自动飘过一两句吐槽。","这种旁白多数是轻的、好玩的，属于注意力自己找乐子。它不耗人，反而常常是你观察力细的证据。"],
      gift:"会给自己配旁白的人，通常不太会把日子过闷。",
      share:"「脑子里有个实时解说」——被这四个字精准命中，笑出声。\n{link}"},
    {k:"c",n:"预演导演型",tag:"还没发生，已经拍到第三季",
      body:["你擅长提前推演：可能的走向、对方会怎么说、自己该怎么接，往往在事情发生前就排了好几版。","预演本身是一种准备，挺有用。代价是——最糟那一版常常也被顺手演了一遍，于是人还没到场，已经先累了一轮。","可以试试只排「第一句」，后面留白。第一句够用，剩下的现场接得住。"],
      gift:"准备到第一句就够了，别替还没来的事把台词全写完。",
      share:"我能在事情发生前演完三季，还自带最糟结局。今天决定只写第一句。\n{link}"},
    {k:"d",n:"复盘剪辑师型",tag:"散场之后才开始忙",
      body:["当场你挺稳，回家路上开始剪：那句是不是多余、那个停顿是什么意思、如果换个说法会怎样。","心理学叫「事后反刍」。它伪装成复盘，其实常在用已经无法修改的素材，反复追求一个不存在的完美版本。","一个能用的刹车：只问「下次我会怎么做」，不问「刚才我该怎么做」。方向一换，回放就短了。"],
      gift:"复盘留给下次，别用来审判已经过去的那一场。",
      share:"「散场之后才开始忙」太准了。以后只问下次怎么做，不审刚才。\n{link}"},
    {k:"e",n:"语气考据型",tag:"一个「嗯」能考出三层意思",
      body:["你对语气、标点、回复间隔特别敏感。别人眼里的一个字，到你这儿是一份需要细读的材料。","敏感不是毛病，它说明你很在意关系里的细微变化。只是当外部信号不够清楚时，人容易用想象去填空，而填进去的往往是最让自己不安的那一版。","核对一下就好：把「我猜他觉得」换成「他实际说了什么」，常常一下就轻了。"],
      gift:"把观察和解读分开，是对自己最温柔的一种诚实。",
      share:"一个「嗯」我能考据出三层意思…今天学会把它换回「他实际说了什么」。\n{link}"},
    {k:"f",n:"深夜编剧型",tag:"白天没事，夜里自动开机",
      body:["你白天挺能扛，一到夜里、灯一关，脑子就把白天没空处理的东西全搬出来，一集接一集。","这不是你晚上变脆弱了，是白天一直有人在替你按暂停，夜里没人按了。情绪不会因为我们没空就消失，它只是排队。","给它一个固定的、白天的五分钟，比在深夜硬扛整场有效得多。"],
      gift:"情绪不挑时间，但你可以给它留一个不用熬夜的档期。",
      share:"白天没事，夜里自动开机。原来不是我变脆弱，是白天一直被按了暂停。\n{link}"},
    {k:"g",n:"双轨并行型",tag:"一边稳住场面，一边内心全程直播",
      body:["你外表看着很平，里面其实同时跑着两条线：一条在处理眼前，一条在评论眼前。功能不受影响，但耗电量是双份的。","这常是「练出来的稳」——不是没有情绪，是很早就学会了先别让它出来。久了，连自己都容易忽略里面那条线有多吵。","不用逼自己立刻变坦率，只要偶尔承认一句「我这边其实有点满」，就已经在减负了。"],
      gift:"稳住场面很厉害；偶尔也让里面那条线被自己听见。",
      share:"「一边稳住场面一边全程直播」——功能没掉，就是耗电双份。\n{link}"},
    {k:"h",n:"全员剧场型",tag:"一件事能开出好几个视角",
      body:["你脑子里不止一个声音：我会怎么想、他会怎么想、旁人会怎么看、要是换个人又会怎样。信息量很大，也很热闹。","这是心智化能力强的一面——能同时装下好几个人的立场。但视角一多，就很难轮到「那我自己现在是什么感觉」这一句。","下次可以试着把镜头先定在自己身上三秒，再放其他人进场。顺序换一下，会安静不少。"],
      gift:"装得下所有人之后，记得也给自己的感受留一个座位。",
      share:"脑子里能同时开好几个视角，却总忘了问自己那句「我现在什么感觉」。\n{link}"}
  ],
  questions: [
    {t:"聊完天回家路上，你脑子里通常在？",o:[["什么都没有，或者下一顿吃什么","a"],["给刚才的场景配两句旁白","b"],["重播自己说过的那几句","d"],["顺便把对方的想法也演一遍","h"]]},
    {t:"对方回了个「嗯」，你的第一反应？",o:[["嗯，收到","a"],["「嗯」字自带弹幕感","b"],["会不会有点冷淡","e"],["得看是哪种「嗯」、隔了多久","e"]]},
    {t:"明天有个要开口的场合，今晚你会？",o:[["到时再说","a"],["顺手想个开场","b"],["把可能的走向排几版","c"],["连最糟那版也顺便演完","c"]]},
    {t:"一件小事过去三天了，它还会冒出来吗？",o:[["基本不会","a"],["偶尔当个梗想起来","b"],["会，主要是在夜里","f"],["会，而且每次剪得不一样","d"]]},
    {t:"你最常在哪一刻突然开始「想事情」？",o:[["不太有固定时刻","a"],["走路、排队这种空档","b"],["关灯之后","f"],["和人说完话的下一秒","d"]]},
    {t:"别人一句没头没尾的话，你会？",o:[["等他说完","a"],["心里吐槽一下就算了","b"],["先琢磨是不是有别的意思","e"],["同时猜好几种可能","h"]]},
    {t:"当场受了点不舒服，你通常？",o:[["当场就说，或者当场就过","a"],["先记着，回头自己消化","g"],["表面很稳，里面开始直播","g"],["当场没事，晚上全回来","f"]]},
    {t:"你脑子里的「声音」更像？",o:[["挺安静的","a"],["一个爱吐槽的旁白","b"],["一个总在排练的导演","c"],["好几个人在同时说话","h"]]},
    {t:"刷到一条旧聊天记录，你会？",o:[["滑过去","a"],["笑一下当年挺逗","b"],["开始重新理解那几句","e"],["顺手复盘整段关系","d"]]},
    {t:"做决定之前，你脑子里先出现的是？",o:[["「我想要哪个」","a"],["「先试试看」","b"],["「如果出问题会怎样」","c"],["「每个人分别会怎么想」","h"]]},
    {t:"忙了一整天，睡前最难的是？",o:[["没什么难的，困了就睡","a"],["把脑子里的旁白关掉","b"],["停止预演明天","c"],["让白天那些东西别排队进来","f"]]},
    {t:"和不太熟的人相处完，你会不会有点累？",o:[["不太会","a"],["还行，就是话少了点","b"],["会，因为一直在留意分寸","e"],["会，同时跑着好几条线","g"]]},
    {t:"你给朋友讲一件事，通常会讲成？",o:[["三句话结论","a"],["带点吐槽的版本","b"],["连当时心理活动都带上","h"],["重点在「事后我又想了想」","d"]]},
    {t:"「如果当初那样说就好了」这句话，你熟吗？",o:[["不熟","a"],["偶尔，当笑话讲","b"],["挺熟，尤其在夜里","f"],["熟，而且能列出好几版","d"]]},
    {t:"安静下来五分钟，你最容易？",o:[["放空，挺舒服","a"],["冒出点随机念头","b"],["自动开始排下一件事","c"],["把几个视角轮着放一遍","h"]]},
    {t:"你更常对自己说的是哪句？",o:[["「行，就这样」","a"],["「有点好笑」","b"],["「先想清楚再说」","c"],["「我是不是想太多了」","e"]]},
    {t:"消息发出去之后的那两分钟，你在？",o:[["去干别的了","a"],["随手刷两下","b"],["看一眼有没有回","e"],["已经把对方可能的反应排完","c"]]},
    {t:"一部剧看完了，你脑子里留得最久的是？",o:[["没什么特别","a"],["几句好笑的台词","b"],["某个角色为什么那样选","h"],["如果是我会怎么处理","d"]]},
    {t:"你有没有过「明明没事，却有点累」的时候？",o:[["几乎没有","a"],["偶尔，睡一觉就好","b"],["有，多半是夜里","f"],["挺常的，因为脑子一直在跑","g"]]},
    {t:"如果内心戏有片尾字幕，你的是？",o:[["「全剧终」","a"],["「未完待续（轻松版）」","b"],["「下集预告已生成」","c"],["「本片由全体演员共同出演」","h"]]}
  ]
};
</script>
<script>/* 心里那点事 · 答题引擎
   纯前端单页：封面 → 0.99 解锁码门禁 → N 题 → 结果报告
   答案只在本地计算，不上传、不收集任何信息
   可选封面增强字段（旧数据不填即保持原样）：
     theme      : 'teal' | 'ink'   → 给 .wrap 加主题 class
     coverArt   : 内联 SVG 字符串  → 封面装饰插画
     slogan     : 手写体标语
     pill       : true             → 4 维度改成胶囊网格
*/
(function(){
  var D = window.QUIZ_DATA;
  var C = window.SHOP_CONFIG;
  var app = document.getElementById('app');
  var answers = [], idx = 0;
  var LS = 'unlock_' + D.id;

  if(D.theme){ var w=document.querySelector('.wrap'); if(w) w.classList.add('theme-'+D.theme); }

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function unlocked(){ try{ return localStorage.getItem(LS)==='1'; }catch(e){ return false; } }
  function setUnlocked(){ try{ localStorage.setItem(LS,'1'); }catch(e){} }
  function head(){ return '<div class="topbar"><span class="brand"><span class="dot"></span>'+esc(C.series)+'</span><a href="index.html">全部测试</a></div>'; }
  function toast(t){
    var el=document.getElementById('toast');
    if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; document.body.appendChild(el); }
    el.textContent=t; el.classList.add('show');
    clearTimeout(window.__t); window.__t=setTimeout(function(){el.classList.remove('show');},1900);
  }
  function copy(text,msg){
    var ok=function(){toast(msg||'已复制');};
    if(navigator.clipboard&&window.isSecureContext){ navigator.clipboard.writeText(text).then(ok,fb); } else fb();
    function fb(){
      var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); ok(); }catch(e){ toast('复制失败，请长按选择文字'); }
      document.body.removeChild(ta);
    }
  }

  /* ---------- 封面 ---------- */
  function renderCover(){
    var checks = D.checks.map(function(c){
      if(D.pill) return '<li><span class="ck">✓</span><span class="pt"><b>'+esc(c[0])+'</b><small>'+esc(c[1])+'</small></span></li>';
      return '<li><span class="ck">✓</span><span><b>'+esc(c[0])+'</b> ｜ '+esc(c[1])+'</span></li>';
    }).join('');
    var art = D.coverArt ? '<div class="cover-art">'+D.coverArt+'</div>' : '';
    var slogan = D.slogan ? '<div class="slogan">'+esc(D.slogan)+'</div>' : '';
    app.innerHTML = head()+
      '<div class="cover">'+
        '<div class="vol"><span>'+esc(D.vol)+'</span><span>'+esc(D.quizCount)+'</span></div>'+
        '<span class="cover-tag">'+esc(D.tag)+'</span>'+
        '<h1 class="cover-title">'+D.title+'</h1>'+
        '<p class="cover-sub">'+esc(D.subtitle)+'</p>'+
        art+
        '<ul class="checklist'+(D.pill?' pill':'')+'">'+checks+'</ul>'+
        slogan+
        '<button class="cover-btn" id="go">点击测试 →</button>'+
        '<div class="meta"><span><b>'+D.questions.length+'</b> 道题</span><span>约 <b>'+esc(D.minutes)+'</b> 分钟</span><span><b>'+D.types.length+'</b> 种结果</span><span>凭第一直觉选</span></div>'+
      '</div>'+
      '<div class="paywall" id="pw">'+
        '<div class="lock">🔒</div>'+
        '<div class="price">¥'+esc(C.price)+'<small>/ 份 · 虚拟商品</small></div>'+
        '<h3>拍下后，才能开始测</h3>'+
        '<p>拍下后平台会「自动发货」，把<b>解锁码</b>发给你。在下面输入就能开始，答案只在你自己手机里计算。</p>'+
        '<input class="code-input" id="code" placeholder="输入自动发货消息里的解锁码" autocomplete="off" spellcheck="false">'+
        '<div class="err" id="err"></div>'+
        '<button class="btn hl" id="unlock">输入解锁码，开始测试</button>'+
        (C.shopUrl ? '<div class="btn-row"><a class="btn ghost" href="'+esc(C.shopUrl)+'" target="_blank" rel="noopener">还没拍？去拍下 ¥'+esc(C.price)+' →</a></div>' : '')+
        '<p class="pay-note">'+esc(D.disclaimer)+'</p>'+
      '</div>'+
      '<div class="src">'+D.source+'</div>'+
      '<div class="footer">'+esc(C.series)+' · 仅供娱乐，不是心理诊断</div>';
    document.getElementById('go').onclick=function(){
      if(unlocked()){ answers=[]; idx=0; renderQuestion(); }
      else { document.getElementById('pw').scrollIntoView({behavior:'smooth',block:'center'}); document.getElementById('code').focus(); toast('先输入解锁码就能开始～'); }
    };
    document.getElementById('unlock').onclick=function(){
      var v=(document.getElementById('code').value||'').trim().toUpperCase();
      var list=(C.codes[D.id]||[]).map(function(x){return x.toUpperCase();});
      if(!v){ document.getElementById('err').textContent='请先输入解锁码'; return; }
      if(list.indexOf(v)<0){ document.getElementById('err').textContent='解锁码不对，检查一下自动发货消息里的码'; return; }
      setUnlocked(); answers=[]; idx=0; renderQuestion();
    };
    window.scrollTo(0,0);
  }

  /* ---------- 答题 ---------- */
  function renderQuestion(){
    var q=D.questions[idx];
    var pct=Math.round(idx/D.questions.length*100);
    var opts=q.o.map(function(o,i){
      return '<button class="opt" data-v="'+i+'"><span class="k">'+String.fromCharCode(65+i)+'</span>'+esc(o[0])+'</button>';
    }).join('');
    app.innerHTML = head()+
      '<div class="quiz">'+
        '<div class="qcount">第 '+(idx+1)+' / '+D.questions.length+' 题</div>'+
        '<div class="progress"><i style="width:'+pct+'%"></i></div>'+
        '<div class="qtitle">'+esc(q.t)+'</div>'+
        '<div class="qhint">凭第一直觉选，别想太多～</div>'+
        '<div class="opts">'+opts+'</div>'+
        (idx>0?'<div class="backlink" id="back">← 上一题</div>':'')+
      '</div>'+
      '<div class="footer">'+esc(C.series)+'</div>';
    var bs=app.querySelectorAll('.opt');
    Array.prototype.forEach.call(bs,function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(bs,function(x){x.classList.remove('on');});
        b.classList.add('on');
        var v=parseInt(b.getAttribute('data-v'),10);
        setTimeout(function(){
          answers[idx]=q.o[v][1]; idx++;
          if(idx>=D.questions.length) renderResult(); else renderQuestion();
        },160);
      };
    });
    if(idx>0) document.getElementById('back').onclick=function(){idx--;renderQuestion();};
    window.scrollTo(0,0);
  }

  /* ---------- 结果 ---------- */
  function renderResult(){
    var score={}; D.types.forEach(function(t){score[t.k]=0;});
    answers.forEach(function(k){ if(k in score) score[k]++; });
    var sorted=D.types.slice().sort(function(a,b){return score[b.k]-score[a.k];});
    var win=sorted[0], total=D.questions.length;
    var pct=Math.round(score[win.k]/total*100);
    var max=Math.max.apply(null,D.types.map(function(t){return score[t.k];}))||1;
    var bars=D.types.map(function(t){
      var v=Math.round(score[t.k]/max*100);
      return '<div class="bar'+(t.k===win.k?' top':'')+'"><div class="lab"><span>'+esc(t.n)+'</span><b>'+score[t.k]+'</b></div>'+
             '<div class="track"><i style="width:'+Math.max(2,v)+'%"></i></div></div>';
    }).join('');
    var all=D.types.map(function(t,i){
      return '<div class="allrow"><span class="n">'+(i+1<10?'0':'')+(i+1)+'</span><span class="nm">'+esc(t.n)+'</span><span class="ds">'+esc(t.tag)+'</span></div>';
    }).join('');
    var body=win.body.map(function(p){return '<p>'+esc(p)+'</p>';}).join('');
    var share=win.share.replace(/\{link\}/g,location.href.split('#')[0]);
    app.innerHTML = head()+
      '<div class="result">'+
        '<div class="result-tag">'+esc(D.vol)+' · 你的报告</div>'+
        '<h2 class="result-title">'+esc(win.n)+'</h2>'+
        '<div class="result-lead">'+esc(win.tag)+'</div>'+
        '<div class="concentration"><b>'+pct+'%</b> 成分浓度 · 你选了 '+score[win.k]+' / '+total+' 题指向它</div>'+
        '<div class="result-body">'+body+'</div>'+
        '<div class="gift"><span class="lab">可以带走的一句话</span>'+esc(win.gift)+'</div>'+
        '<div class="bars"><div class="share-box" style="border:0;padding-top:18px;margin-top:0"><div class="lab">十种类型的成分条</div></div>'+bars+'</div>'+
        '<div class="share-box">'+
          '<div class="lab">一键复制 · 发笔记/发给朋友</div>'+
          '<div class="share-text" id="st">'+esc(share)+'</div>'+
          '<div class="btn-row"><button class="btn small hl" id="cs">复制文案</button><button class="btn small ghost" id="cl">复制测试链接</button></div>'+
          '<div class="btn-row"><button class="btn small ghost" id="again">重新测一次</button></div>'+
        '</div>'+
        '<div class="allresults"><h4>查看全部 '+D.types.length+' 种结果</h4>'+all+'</div>'+
      '</div>'+
      '<div class="note">'+esc(D.disclaimer)+'</div>'+
      '<div class="footer">'+esc(C.series)+' · 仅供娱乐，不是心理诊断</div>';
    document.getElementById('cs').onclick=function(){copy(share,'文案已复制，去发笔记吧');};
    document.getElementById('cl').onclick=function(){copy(location.href.split('#')[0],'测试链接已复制');};
    document.getElementById('again').onclick=function(){answers=[];idx=0;renderQuestion();};
    window.scrollTo(0,0);
  }

  renderCover();
})();
</script>
</body></html>
